<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contraption Lab, an original browser physics puzzle prototype"
    />
    <title>Contraption Lab</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">Technical prototype</p>
          <h1>Contraption Lab</h1>
        </div>
        <div class="status-panel" aria-live="polite">
          <p id="timer-label" class="timer-label" hidden>Time: 0:00</p>
          <p id="mode-label" class="mode-label">Mode: Edit</p>
        </div>
      </header>
      <section class="play-header" aria-live="polite">
        <div class="play-header-summary">
          <p id="level-progress-label">Level 1 of 3 — Basic</p>
          <button
            id="puzzle-selector-button"
            class="puzzle-title-button"
            type="button"
            aria-controls="puzzle-selector-panel"
            aria-expanded="false"
          >
            Relay Ramps
          </button>
          <span id="timed-indicator" class="timed-indicator">Timed</span>
        </div>
        <div
          class="play-header-tools"
          role="group"
          aria-label="Puzzle settings and parts"
        >
          <button id="settings-button" type="button">Settings</button>
          <button
            id="parts-palette-toggle"
            type="button"
            aria-controls="parts-palette-content"
            aria-expanded="false"
          >
            Parts
          </button>
        </div>
      </section>
      <section
        id="puzzle-selector-panel"
        class="overlay-panel"
        aria-label="Puzzle selector"
        hidden
      >
        <div id="puzzle-selector-list"></div>
      </section>
      <section
        id="settings-panel"
        class="overlay-panel settings-panel"
        aria-label="Settings"
        hidden
      >
        <label>
          <input id="unlock-all-checkbox" type="checkbox" />
          Unlock all puzzles
        </label>
      </section>
      <section id="play-area" class="play-area play-area--palette-collapsed">
        <section
          id="game-container"
          aria-label="Physics puzzle play area"
        ></section>
        <aside
          id="parts-palette"
          class="parts-palette"
          aria-label="Parts palette"
          hidden
        >
          <div class="parts-palette-header">
            <span class="parts-palette-title">Parts</span>
          </div>
          <div id="parts-palette-content" class="parts-palette-content">
            <div class="parts-palette-items" aria-label="Available parts">
              <button id="tray-ball-button" type="button" aria-label="Ball">
                <span
                  class="part-preview part-preview--ball"
                  aria-hidden="true"
                ></span>
                <span id="tray-ball-label" class="part-palette-label"
                  >Ball</span
                >
              </button>
              <button id="tray-block-button" type="button" aria-label="Block">
                <span
                  class="part-preview part-preview--block"
                  aria-hidden="true"
                ></span>
                <span id="tray-block-label" class="part-palette-label"
                  >Block</span
                >
              </button>
              <button id="tray-ramp-button" type="button" aria-label="Ramp">
                <span
                  class="part-preview part-preview--ramp"
                  aria-hidden="true"
                ></span>
                <span id="tray-ramp-label" class="part-palette-label"
                  >Ramp</span
                >
              </button>
            </div>
          </div>
        </aside>
      </section>
      <p id="edit-feedback" class="edit-feedback" aria-live="polite" hidden></p>
      <nav class="controls simulation-toolbar" aria-label="Simulation controls">
        <button id="edit-button" type="button">Edit</button>
        <button id="simulation-button" type="button">Run</button>
        <button id="rerun-button" type="button" disabled>Rerun</button>
        <button id="reset-button" type="button">Reset</button>
        <button id="next-puzzle-button" type="button" hidden>
          Next Puzzle
        </button>
      </nav>
      <p class="hint">
        Use both brass ramps to guide the ball into the striped goal.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
